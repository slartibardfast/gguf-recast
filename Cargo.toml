[package]
name = "gguf-recast"
version = "0.1.0"
edition = "2021"
description = "GGUF recast tooling: AutoRound INT4 -> Q4_0/Q4_0_AR16 GGUF remix, and BF16 -> FP16 selective recast"
license = "MIT"

[dependencies]
memmap2 = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[profile.release]
# Reproducibility: no incremental state in the artifact, single codegen unit.
incremental = false
codegen-units = 1
